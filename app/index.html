  for (const el of document.querySelectorAll('[data-for]')) el.hidden = el.dataset.for !== tab;
}

function renderEngineList() {
  const sel = $('#engSel'), list = lib.prefs.engines || [];
  sel.innerHTML = '';
  list.forEach((e, i) => sel.append(new Option(e.name, i)));
  sel.value = lib.prefs.engine || 0;
  sel.hidden = $('#engRemove').hidden = !list.length;
  $('#engGo').textContent = t(Eng.on ? 'eng_stop' : 'eng_analyze');
  if (!Eng.on && !Eng.starting) engineMessage();
}

function engineMessage(msg) {
  $('#engHead').innerHTML = '';
  const box = $('#engLines');
  box.innerHTML = '<div class="empty"></div>';
  box.firstChild.textContent = msg || (!Backend.desktop ? t('eng_desktop_only') : (lib.prefs.engines || []).length ? t('eng_idle') : t('eng_none'));
}

async function startEngine(path) {
  Eng.starting = true;
  engineMessage(t('eng_starting', { name: fileName(path) }));
  const res = await Backend.api.engine_start(path);
  Eng.starting = false;
  if (!res.ok) { Eng.loadedPath = null; engineMessage(t('eng_failed', { error: res.error })); return null; }
  Eng.loadedPath = path;
  return res;
}

async function addEngine() {
  if (!Backend.desktop) { toast(t('eng_desktop_only')); return; }
  const path = await Backend.api.engine_pick();
  if (!path) return;
  await toggleEngine(false);
  const res = await startEngine(path);
  if (!res) return;
  const list = (lib.prefs.engines || []).filter(e => e.path !== path);
  list.push({ name: res.name, path });
  lib.prefs.engines = list;
  lib.prefs.engine = list.length - 1;
  scheduleSave();
  toggleEngine(true);
}

function removeEngine() {
  const list = lib.prefs.engines || [], i = lib.prefs.engine || 0;
  if (!list[i] || !confirm(t('eng_remove_q', { name: list[i].name }))) return;
  toggleEngine(false);
  list.splice(i, 1);
  lib.prefs.engine = 0;
  scheduleSave();
  renderEngineList();
}

async function toggleEngine(on = !Eng.on) {
  if (!Backend.desktop) { toast(t('eng_desktop_only')); return; }
  if (Eng.starting) return;
  if (!on) {
    Eng.on = false;
    clearInterval(Eng.timer);
    await Backend.api.engine_stop();
    renderEngineList();
    return;
  }
  const e = (lib.prefs.engines || [])[lib.prefs.engine || 0];
  if (!e) { addEngine(); return; }
  setTab('engine');
  if (Eng.loadedPath !== e.path && !(await startEngine(e.path))) return;
  Eng.on = true;
  Eng.fen = null;
  renderEngineList();
  engineFollow();
  clearInterval(Eng.timer);
  Eng.timer = setInterval(pollEngine, 350);
}

// Called whenever the board changes: analyse the new position
function engineFollow() {
  if (!Eng.on || !cur) return;
  const fen = engineFen(cur.st);
  if (fen === Eng.fen) return;
  Eng.fen = fen;
  if (!legalMoves(cur.st).length) { Backend.api.engine_stop(); engineMessage(t('eng_game_over')); return; }
  engineMessage(t('eng_thinking'));
  Backend.api.engine_analyze(fen).then(r => { if (r !== true) engineMessage(t('eng_failed', { error: r })); });
}

async function pollEngine() {
  if (!Eng.on) return;
  const s = await Backend.api.engine_poll();
  if (!Eng.on || s.fen !== Eng.fen) return;
  if (!s.running) {
    Eng.on = false; Eng.loadedPath = null;
    clearInterval(Eng.timer);
    renderEngineList();
    engineMessage(t('eng_failed', { error: s.error || 'stopped' }));
    return;
  }
  if (s.lines.length) renderEngine(s);
}

// UCI scores are from the side to move; Grandmist shows everything from White's point of view
function scoreText(score, turn) {
  let [kind, v] = score;
  if (turn === 'b') v = -v;
  return kind === 'mate' ? (v > 0 ? '#' : '#-') + Math.abs(v) : (v > 0 ? '+' : '') + (v / 100).toFixed(2);
}

function uciToMoves(st, uci, limit = 14) {
  const out = [];
  for (const u of uci.slice(0, limit)) {
    const from = sqIdx(u.slice(0, 2)), to = sqIdx(u.slice(2, 4)), pr = u[4] || '';
    const legal = legalMoves(st);
    const m = legal.find(x => x.from === from && x.to === to && (x.promo || '') === pr);
    if (!m) break;
    out.push({ m, num: st.turn === 'w' ? st.full + '.' : out.length ? '' : st.full + '…', san: toSAN(st, m, legal) });
    st = makeMove(st, m);
  }
  return out;
}

function renderEngine(s) {
  const st = cur.st, top = s.lines[0];
  const wdl = top.wdl && (st.turn === 'w' ? top.wdl : [top.wdl[2], top.wdl[1], top.wdl[0]]);
  const pct = x => Math.round(x / 10);
  let head = `<span class="eng-score">${scoreText(top.score, st.turn)}</span>`;
  if (wdl) head += `<div class="bar eng-bar" title="${t('wdl_tip', { w: pct(wdl[0]), d: pct(wdl[1]), l: pct(wdl[2]) })}"><span class="w" style="width:${wdl[0] / 10}%"></span><span class="d" style="width:${wdl[1] / 10}%"></span><span class="l" style="width:${wdl[2] / 10}%"></span></div>`;
  head += `<span class="eng-stats"></span>`;
  $('#engHead').innerHTML = head;
  $('#engHead .eng-stats').textContent = t('eng_stats', { d: top.depth || 0, nodes: fmtN(top.nodes || 0), nps: fmtN(top.nps || 0) }) + ' · ' + s.name;
  Eng.pvs = s.lines.map(l => uciToMoves(st, l.pv));
  $('#engLines').innerHTML = s.lines.map((l, i) =>
    `<div class="eng-line"><span class="eng-ev">${scoreText(l.score, st.turn)}</span>` +
    Eng.pvs[i].map((x, k) => `<span class="eng-mv" data-l="${i}" data-k="${k}">${x.num}${x.san}</span>`).join(' ') + '</div>').join('');
}

// Clicking a move in an engine line plays the line up to that move (adding it as a variation if needed)
$('#engLines').addEventListener('click', e => {
  const el = e.target.closest('.eng-mv');
  if (!el) return;
  const pv = Eng.pvs[+el.dataset.l];
  for (let k = 0; k <= +el.dataset.k; k++) playMove(pv[k].m);
});
for (const b of document.querySelectorAll('.ptab')) b.onclick = () => setTab(b.dataset.tab);
$('#engGo').onclick = () => toggleEngine();
$('#engAdd').onclick = addEngine;
$('#engRemove').onclick = removeEngine;
$('#engSel').onchange = async e => {
  lib.prefs.engine = +e.target.value;
  scheduleSave();
  if (Eng.on) { await toggleEngine(false); toggleEngine(true); }
};

// ===================== Import games from Lichess / Chess.com =====================
// Both sites have free public APIs. All of a player's games become one new .gm file,
// grouped by colour and opening so they can be explored in the tree view.
const IO = { busy: false, cancel: false };
const ioStatus = msg => { $('#ioStatus').textContent = msg; };

async function getText(url, accept) {
  if (Backend.desktop) {
    const r = await Backend.api.fetch(url, accept);
    if (!r.ok) throw Object.assign(new Error(r.error), { status: r.status });
    return r.text;
  }
  const r = await fetch(url, { headers: { Accept: accept } });
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { status: r.status });
  return r.text();
}

async function downloadGames(site, user, max) {
  if (site === 'lichess') {
    ioStatus(t('io_downloading'));
    const q = new URLSearchParams({ opening: 'true', clocks: 'false', evals: 'false' });
    if (max) q.set('max', max);
    return splitPGN(await getText(`https://lichess.org/api/games/user/${encodeURIComponent(user)}?${q}`, 'application/x-chess-pgn'));
  }
  const base = `https://api.chess.com/pub/player/${encodeURIComponent(user.toLowerCase())}/games`;
  const archives = JSON.parse(await getText(base + '/archives', 'application/json')).archives || [];
  let games = [];
  for (const url of archives.reverse()) { // newest month first
    if (IO.cancel) break;
    ioStatus(t('io_month', { month: url.split('/').slice(-2).join('-'), n: games.length }));
    games = games.concat(splitPGN(await getText(url + '/pgn', 'application/x-chess-pgn')).reverse());
    if (max && games.length >= max) break;
  }
  return max ? games.slice(0, max) : games;
}

// "Sicilian Defense: Najdorf Variation" (Lichess) or an ECOUrl slug (Chess.com) → "Sicilian Defense"
function openingFamily(h) {
  if (h.Opening) return h.Opening.split(':')[0].trim();
  const m = (h.ECOUrl || '').match(/openings\/([^?#]+)/);
  if (!m) return h.ECO || '';
  const out = [];
  for (const w of m[1].split('-')) {
    if (/^\d/.test(w)) break;
    out.push(w);
    if (/^(Defense|Defence|Opening|Game|Gambit|Attack|System)$/.test(w)) break;
  }
  return out.join(' ');
}

async function importOnline() {
  const site = $('#ioSite').value, user = $('#ioUser').value.trim(), max = +$('#ioMax').value;
  if (!user || IO.busy || !confirmDiscard()) return;
  Object.assign(lib.prefs, { ioSite: site, ioUser: user, ioMax: max });
  scheduleSave();
  IO.busy = true; IO.cancel = false;
  $('#ioGo').disabled = true;
  try {
    const games = await downloadGames(site, user, max);
    const records = [];
    let skipped = 0;
    for (let i = 0; i < games.length && !IO.cancel; i++) {
      if (i % 20 === 0) { ioStatus(t('io_parsing', { i, n: games.length })); await new Promise(r => setTimeout(r)); }
      if (/\[Variant "(?!Standard|From Position)/.test(games[i])) { skipped++; continue; } // e.g. Chess960
      try {
        const p = parseRecordPGN(games[i]), h = p.headers;
        const asWhite = h.White.toLowerCase() === user.toLowerCase();
        h.Category = t(asWhite ? 'as_white' : 'as_black') + '/' + (openingFamily(h) || t('uncategorized'));
        records.push(makeRecord(p));
      } catch (e) { skipped++; }
    }
    if (IO.cancel) return;
    if (!records.length) { ioStatus(t('io_none', { user })); return; }
    setDocument(records, null, `${user} (${site === 'lichess' ? 'Lichess' : 'Chess.com'})`, null);
    markDirty();
    $('#onlineDlg').close();
    toast(t('imported', { n: records.length }) + (skipped ? ' · ' + t('io_skipped', { n: skipped }) : ''), 5000);
  } catch (e) {
    ioStatus(e.status === 404 ? t('io_not_found', { user }) : t('io_failed', { error: e.message }));
  } finally {
    IO.busy = false;
    $('#ioGo').disabled = false;
  }
}

function openOnlineDialog() {
  $('#ioSite').value = lib.prefs.ioSite || 'lichess';
  $('#ioUser').value = lib.prefs.ioUser || '';
  $('#ioMax').value = lib.prefs.ioMax ?? 200;
  ioStatus('');
  $('#onlineDlg').showModal();
  $('#ioUser').focus();
}
$('#ioGo').onclick = importOnline;
$('#ioUser').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); importOnline(); } });
$('#onlineDlg').addEventListener('close', () => { if (IO.busy) IO.cancel = true; });

// ===================== Game review (only when the optional core is installed) =====================
const RV = { busy: false };
const reviewAvailable = () => !!(Backend.core && Backend.core.available && (Backend.core.capabilities || []).includes('review'));
function mainlineNodes(r) { const out = []; let n = r.root; while (n.children.length) { n = n.children[0]; out.push(n); } return out; }

function renderReviewTab() {
  $('#reviewTab').hidden = !reviewAvailable();
  const sel = $('#rvLevel');
  if (!sel.options.length) for (let r = 1100; r <= 1900; r += 100) sel.append(new Option(r, r));
  sel.value = lib.prefs.rvLevel || 1500;
  renderReview();
}

function reviewMessage(msg) {
  const box = $('#rvBody');
  box.innerHTML = '<div class="empty"></div>';
  box.firstChild.textContent = msg;
}

// The review belongs to the record it was made for; it is stale once the main line changes
function reviewOf(r) {
  const v = r && r._review;
  if (!v) return null;
  const nodes = mainlineNodes(r);
  return v.nodes.every((n, i) => nodes[i] === n) ? v : null;
}
function reviewVerdict(node) {
  const v = reviewOf(rec);
  if (!v) return null;
  const i = v.nodes.indexOf(node);
  const m = i < 0 ? null : v.data.key_moments.find(k => k.ply === i + 1);
  return m ? m.verdict : null;
}

function renderReview() {
  if (!reviewAvailable() || !rec) return;
  if (RV.busy) return;
  const v = reviewOf(rec), box = $('#rvBody');
  if (!v) { reviewMessage(rec._review ? t('rv_stale') : t('rv_intro')); return; }
  box.innerHTML = '';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  if (v.data.opening_text) {
    const card = mk('div', 'rv-card v-opening');
    card.append(mk('div', 'rv-head', t('rv_opening')), mk('div', 'rv-text', v.data.opening_text));
    box.append(card);
  }
  if (!v.data.key_moments.length) box.append(mk('div', 'empty', t('rv_none')));
  for (const m of v.data.key_moments) {
    const card = mk('div', 'rv-card v-' + m.verdict);
    const head = mk('div', 'rv-head');
    const mv = mk('span', 'rv-move', m.move);
    mv.onclick = () => { setView('board'); goTo(v.nodes[m.ply - 1]); };
    head.append(mv, mk('span', 'rv-badge', t('v_' + m.verdict)));
    card.append(head);
    if (m.comment) card.append(mk('div', 'rv-text', m.comment));
    if (['blunder', 'mistake', 'inaccuracy'].includes(m.verdict))
      card.append(mk('div', 'rv-stats', t('rv_chances', { a: m.winning_chance_before_pct, b: m.winning_chance_after_pct })));
    if (m.takeaway) card.append(mk('div', 'rv-take', '💡 ' + m.takeaway));
    box.append(card);
  }
  box.append(mk('div', 'hint rv-src', t(v.data.explanation_source === 'ai' ? 'rv_src_ai' : 'rv_src_rules')));
}

async function startReview() {
  if (RV.busy || !rec || !reviewAvailable()) return;
  const r = rec, nodes = mainlineNodes(r);
  if (!nodes.length) { reviewMessage(t('rv_need_moves')); return; }
  lib.prefs.rvLevel = +$('#rvLevel').value;
  scheduleSave();
  const h = r.headers;
  const res = await Backend.api.core_job_start('review', {
    moves: nodes.map(n => n.san), start_fen: r.startFEN, rating: lib.prefs.rvLevel, language: I18N.code,
    headers: { Title: h.Title, White: h.White, Black: h.Black, Event: h.Event, Date: h.Date, Result: h.Result },
  });
  if (!res.ok) { reviewMessage(t('rv_failed', { error: res.error })); return; }
  RV.busy = true;
  $('#rvGo').disabled = true;
  reviewMessage(t('rv_starting'));
  const tick = async () => {
    const j = await Backend.api.core_job_poll(res.id);
    if (!j.done) {
      if (rec === r && j.progress > 0) reviewMessage(t('rv_running', { pct: Math.round(j.progress * 100) }));
      setTimeout(tick, 500);
      return;
    }
    RV.busy = false;
    $('#rvGo').disabled = false;
    if (!j.result.ok) { reviewMessage(t('rv_failed', { error: j.result.error })); return; }
    r._review = { data: j.result.result, nodes };
    if (rec === r) { renderReview(); renderNotation(); }
    toast(t('rv_done'));
  };
  tick();
}
$('#rvGo').onclick = startReview;

// ===================== Startup =====================
const SAMPLE = `[Title "Sample: Italian Game"]
[Category "Openings/Open Games"]

{A sample record. Click a move to jump to that position; go back and play a different move to add a variation; right-click a move to promote or delete it.}
1. e4 e5 2. Nf3 Nc6 3. Bc4 {The Italian Game: the bishop eyes the weak f7 square.} Bc5 (3... Nf6 {Two Knights Defence, sharper.} 4. Ng5 d5 5. exd5 Na5 (5... Nxd5?! 6. Nxf7 {Fried Liver Attack}) 6. Bb5+) 4. c3 {Preparing d4 to take the centre.} Nf6 5. d4 exd4 6. cxd4 Bb4+ 7. Bd2 (7. Nc3 {Towards the Moller Attack}) 7... Bxd2+ 8. Nbxd2 d5 *`;

(async function init() {
  await Backend.init();
  lib.prefs = (await Backend.loadSettings()).prefs || {};
  Backend.core = await Backend.coreInfo();
  await loadLanguages();
  setLanguage(lib.prefs.lang || 'en');
  $('#treeVars').checked = lib.prefs.treeVars !== false;
  $('#treeScope').value = lib.prefs.treeScope || 'all';
  $('#gDepth').value = lib.prefs.gDepth || 10;
  $('#gScope').value = lib.prefs.gScope || 'record';
  renderReviewTab();
  setTab(lib.prefs.tab || 'engine');
  renderEngineList();
  setView(lib.prefs.view || 'board');
  applyScale();
  // 1) a .gm file double-clicked in Explorer, 2) the library from v1.1.0, 3) the last file, 4) a new file
  const s = await Backend.startup();
  let opened = false;
  if (s.file) opened = await openPath(s.file);
  if (!opened && s.legacy) {
    opened = openText(s.legacy, null, t('my_library') + '.gm');
    if (opened) { markDirty(); toast(t('legacy_open'), 8000); }
  }
  if (!opened && lib.prefs.recent && lib.prefs.recent[0]) opened = await openPath(lib.prefs.recent[0], true);
  if (!opened) {
    setDocument(lib.prefs.seenSample ? [] : [makeRecord(parseRecordPGN(SAMPLE))], null, t('untitled'), null);
    lib.prefs.seenSample = true;
    scheduleSave();
  }
})();
</script>
